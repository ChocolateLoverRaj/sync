[package]
name = "counter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flume = "0.11.1"
flume-overwrite = "0.1.0"
iced = { version = "0.13.1", features = ["webgl", "fira-sans", "tokio"] }
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "sync"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
